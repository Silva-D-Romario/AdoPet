<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopet | Meu Perfil</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa fa-paw"></i></div>
        <span>Adopet</span>
      </a>

      <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
          <i class="bi bi-moon"></i>
          <i class="bi bi-sun"></i>
        </button>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <nav id="nav-auth" class="nav"></nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">
          <div class="page-title-icon"><i class="bi bi-person-circle"></i></div>
          Meu Perfil
        </h1>
        <p class="page-subtitle">Mantenha seus dados atualizados</p>
      </div>
    </div>

    <form id="form-perfil" onsubmit="salvarPerfil(event)">
      <div class="profile-grid">
        <!-- Dados Pessoais -->
        <div class="profile-section">
          <h3 class="profile-section-title"><i class="bi bi-person"></i> Dados Pessoais</h3>

          <div class="form-group">
            <label class="form-label"><i class="bi bi-type"></i> Nome Completo</label>
            <input type="text" id="nomeCompleto" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
            <input type="email" id="email" class="form-input" disabled>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="bi bi-telephone"></i> Telefone</label>
            <input type="text" id="telefone" class="form-input" placeholder="(00) 00000-0000">
          </div>
        </div>

        <!-- Endereço -->
        <div class="profile-section">
          <h3 class="profile-section-title"><i class="bi bi-geo-alt"></i> Endereco</h3>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Rua</label>
              <input type="text" id="rua" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Numero</label>
              <input type="text" id="numero" class="form-input">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Bairro</label>
              <input type="text" id="bairro" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Cidade</label>
              <input type="text" id="cidade" class="form-input" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Estado</label>
              <input type="text" id="estado" class="form-input" maxlength="2" placeholder="UF">
            </div>
            <div class="form-group">
              <label class="form-label">CEP</label>
              <input type="text" id="cep" class="form-input" placeholder="00000-000">
            </div>
          </div>
        </div>

        <div class="profile-actions">
          <button class="btn btn-primary btn-lg" type="submit">
            <i class="bi bi-check"></i> Salvar alteracoes
          </button>
        </div>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">2024 Adopet. Feito com <i class="bi bi-heart-fill" style="color: var(--primary);"></i> para
        os animais.</p>
    </div>
  </footer>

  <div id="toast"></div>

  <script src="js/script.js"></script>
</body>

</html>
