<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopet | Agendar Transporte</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa fa-paw"></i></div>
        <span>Adopet</span>
      </a>

      <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
          <i class="bi bi-moon"></i>
          <i class="bi bi-sun"></i>
        </button>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <nav id="nav-auth" class="nav"></nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">
          <div class="page-title-icon" style="background: var(--success-bg); color: var(--success);"><i
              class="bi bi-calendar-plus"></i></div>
          Agendar Transporte
        </h1>
        <p class="page-subtitle">Agende o transporte para o animal adotado</p>
      </div>
    </div>

    <div class="form-container form-container-wide">
      <form onsubmit="agendarTransporte(event)">
        <input type="hidden" id="animalId">

        <div class="form-group">
          <label class="form-label"><i class="bi bi-geo-alt"></i> Endereco de Origem</label>
          <input type="text" id="origem" class="form-input" required
            placeholder="Ex: Rua Exemplo, 123 - Bairro, Cidade">
        </div>

        <div class="form-group">
          <label class="form-label"><i class="bi bi-geo-alt-fill"></i> Endereco de Destino</label>
          <input type="text" id="destino" class="form-input" required
            placeholder="Ex: Rua Destino, 456 - Bairro, Cidade">
        </div>

        <div class="form-group">
          <label class="form-label"><i class="bi bi-calendar-event"></i> Data do Transporte</label>
          <input type="date" id="dataTransporte" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label"><i class="bi bi-chat-left-text"></i> Observacoes (opcional)</label>
          <textarea id="observacoes" class="form-textarea" rows="3"
            placeholder="Alguma informacao adicional..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-check"></i> Agendar transporte
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">2024 Adopet. Feito com <i class="bi bi-heart-fill" style="color: var(--primary);"></i> para
        os animais.</p>
    </div>
  </footer>

  <div id="toast"></div>

  <script src="js/script.js"></script>
</body>

</html>
