<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopet | Rastreamento do Transporte</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/transport.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa fa-paw"></i></div>
        <span>Adopet</span>
      </a>

      <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
          <i class="bi bi-moon"></i>
          <i class="bi bi-sun"></i>
        </button>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <nav id="nav-auth" class="nav"></nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">
          <div class="page-title-icon" style="background: var(--purple-bg); color: var(--purple);"><i
              class="bi bi-truck"></i></div>
          Acompanhamento de Entrega
        </h1>
        <p class="page-subtitle">Siga o transporte do seu novo amigo</p>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon total" style="background: var(--info-bg); color: var(--info);"><i
            class="bi bi-box-seam"></i>
        </div>
        <div class="stat-content">
          <div id="stat-total" class="stat-value">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon pending" style="background: var(--primary-bg); color: var(--primary);"><i
            class="bi bi-clock-history"></i>
        </div>
        <div class="stat-content">
          <div id="stat-pending" class="stat-value">0</div>
          <div class="stat-label">Pendentes</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon transit" style="background: var(--warning-bg); color: var(--warning);"><i
            class="bi bi-truck"></i>
        </div>
        <div class="stat-content">
          <div id="stat-transit" class="stat-value">0</div>
          <div class="stat-label">A Caminho</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon delivered" style="background: var(--success-bg); color: var(--success);"><i
            class="bi bi-check-circle"></i>
        </div>
        <div class="stat-content">
          <div id="stat-delivered" class="stat-value">0</div>
          <div class="stat-label">Entregues</div>
        </div>
      </div>
    </div>

    <!-- Transport Section -->
    <div class="section-card">
      <div class="section-header">
        <h2 class="section-title">
          <i class="bi bi-list-ul stat-icon" style="background: var(--purple-bg);"></i>
          Lista de Transportes
        </h2>
        <div class="section-controls">
          <div class="tabs">
            <button onclick="filtrarTransportes('todos')" class="tab-btn active" data-filter="todos">
              <i class="bi bi-grid"></i> Todos
            </button>
            <button onclick="filtrarTransportes('PENDENTE')" class="tab-btn" data-filter="PENDENTE">
              <i class="bi bi-clock"></i> Pendentes
            </button>
            <button onclick="filtrarTransportes('A_CAMINHO')" class="tab-btn" data-filter="A_CAMINHO">
              <i class="bi bi-truck"></i> A Caminho
            </button>
            <button onclick="filtrarTransportes('ENTREGUE')" class="tab-btn" data-filter="ENTREGUE">
              <i class="bi bi-check-circle"></i> Entregues
            </button>
          </div>
        </div>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Animal</th>
              <th>Data</th>
              <th>Progresso</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dados carregados via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal de Rastreamento -->
  <div id="modal-rastreamento" class="modal-overlay" onclick="fecharModalRastreamento(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">
          <div class="modal-title-icon"><i class="bi bi-geo-alt"></i></div>
          Rastreamento
        </h3>
        <button class="modal-close" onclick="fecharModal('modal-rastreamento')">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <div id="timeline-container" class="timeline">
          <!-- Timeline items will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">2024 Adopet. Feito com <i class="bi bi-heart-fill" style="color: var(--primary);"></i> para
        os animais.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>

</html>
