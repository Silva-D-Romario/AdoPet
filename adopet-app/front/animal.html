<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopet | Detalhes do Pet</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa fa-paw"></i></div>
        <span>Adopet</span>
      </a>

      <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
          <i class="bi bi-moon"></i>
          <i class="bi bi-sun"></i>
        </button>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <nav id="nav-auth" class="nav"></nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <a href="index.html" class="btn btn-ghost mb-6">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>

    <div class="animal-detail">
      <!-- Image -->
      <div class="animal-image-container">
        <img id="animal-imagem" src="/cute-pet.png" alt="Pet">
      </div>

      <!-- Info -->
      <div class="animal-info">
        <div class="animal-header">
          <h1 id="animal-nome" class="animal-name">Carregando...</h1>
          <div id="animal-tags" class="animal-tags">
            <!-- Tags loaded via JS -->
          </div>
        </div>

        <p id="animal-descricao" class="animal-description">
          Carregando descricao...
        </p>

        <div class="animal-attributes">
          <div class="animal-attribute">
            <div class="animal-attribute-label">Idade</div>
            <div id="animal-idade" class="animal-attribute-value">-</div>
          </div>
          <div class="animal-attribute">
            <div class="animal-attribute-label">Especie</div>
            <div id="animal-especie" class="animal-attribute-value">-</div>
          </div>
          <div class="animal-attribute">
            <div class="animal-attribute-label">Raca</div>
            <div id="animal-raca" class="animal-attribute-value">-</div>
          </div>
          <div class="animal-attribute">
            <div class="animal-attribute-label">Status</div>
            <div id="animal-status" class="animal-attribute-value">-</div>
          </div>
        </div>

        <div class="animal-actions">
          <button class="btn btn-primary btn-lg" onclick="solicitarAdocao()">
            <i class="bi bi-heart-fill"></i> Quero adotar
          </button>
          <a href="denuncia.html" class="btn btn-ghost btn-lg">
            <i class="bi bi-flag"></i> Denunciar
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">2024 Adopet. Feito com <i class="bi bi-heart-fill" style="color: var(--primary);"></i> para
        os animais.</p>
    </div>
  </footer>

  <div id="toast"></div>

  <script src="js/script.js"></script>
</body>

</html>
